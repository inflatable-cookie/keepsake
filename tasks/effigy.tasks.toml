[tasks]
"demo:build:vst2-host-stack" = [
  { run = "mkdir -p .effigy/demo/artifacts/shared" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/shared/vst2-host-stack-configure.log cmake --fresh --preset default" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/shared/vst2-host-stack-build.log cmake --build build --target keepsake keepsake-bridge clap-scan test-plugin host-test host-test-threaded" },
]
"demo:build:vst2-gui-stack" = [
  { run = "mkdir -p .effigy/demo/artifacts/shared" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/shared/vst2-gui-stack-configure.log cmake --fresh --preset default" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/shared/vst2-gui-stack-build.log cmake --build build --target keepsake keepsake-bridge keepsake-bridge-x86_64 mac-clap-host demo-vst2-gui-plugin" },
]
"demo:supported-proof" = [
  { run = "effigy demo run vst2-scan-smoke" },
  { run = "effigy demo run vst2-host-audio-smoke" },
  { run = "effigy demo run vst2-host-threaded-smoke" },
  { run = "effigy demo run vst2-gui-smoke" },
  { run = "effigy demo run vst2-gui-param-state-smoke" },
]
"qa:docs:links" = "effigy docs check links"
"qa:docs:agent-defaults" = "effigy docs check forbidden README.md docs/README.md --forbid '--repo .'"
"qa:docs" = [
  { task = "qa:docs:links" },
  { task = "qa:docs:agent-defaults" },
]
"qa:northstar:spine" = "effigy docs check paths README.md AGENTS.md CLAUDE.md CONTRIBUTING.md docs/README.md docs/plan.md docs/triage/README.md docs/knowledge/README.md docs/knowledge/vision.md docs/knowledge/questions.md docs/knowledge/retired.toml docs/knowledge/architecture/README.md docs/knowledge/architecture/system.md docs/knowledge/architecture/macos-editor.md docs/knowledge/architecture/windows-editor.md docs/knowledge/architecture/native-vst2-host-capabilities.md docs/knowledge/contracts/README.md docs/knowledge/contracts/release.md docs/knowledge/contracts/working-rules.md docs/knowledge/contracts/legal-boundaries.md docs/knowledge/contracts/writing-style.md docs/knowledge/contracts/clap-factory-interface.md docs/knowledge/contracts/ipc-bridge-protocol.md docs/knowledge/contracts/process-isolation-policy.md docs/knowledge/contracts/macos-native-editor-and-host-placeholder.md docs/knowledge/contracts/native-vst2-host-capability-policy.md docs/setup/README.md docs/releases/README.md docs/known-issues-v0.1-alpha.md docs/demos.md"
"qa:northstar:agent-contract" = "effigy docs check contains AGENTS.md --require 'effigy tasks' --require 'effigy test --plan' --require 'docs/README.md' --require 'docs/knowledge/README.md' --require 'docs/plan.md'"
"qa:northstar:readme" = "effigy docs check contains README.md --require 'docs/README.md'"
"qa:northstar:docs-front-door" = "effigy docs check contains docs/README.md --require 'knowledge/README.md' --require 'plan.md'"
"qa:northstar:agent-defaults" = "effigy docs check forbidden README.md AGENTS.md docs/README.md --forbid '--repo .'"
"qa:northstar" = [
  { task = "qa:northstar:spine" },
  { task = "qa:northstar:agent-contract" },
  { task = "qa:northstar:readme" },
  { task = "qa:northstar:docs-front-door" },
  { task = "qa:northstar:agent-defaults" },
]
# Cheap orientation for `effigy doctor`. Full board is `effigy qa`.
# Never alias health to qa.
health = [{ task = "qa:docs:agent-defaults" }]
qa = [{ task = "qa:docs" }, { task = "qa:northstar" }]
"release:candidate:alpha" = "./tools/release-candidate.sh --version v0.1-alpha"
