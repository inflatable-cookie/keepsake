# Repo proof tasks. These were Effigy demos before v0.15 removed that system; they
# are now plain tasks, run with `effigy demo:<name>`. Each comment above a task
# keeps the metadata the old demo table carried (title, summary, proof, owner,
# mode, status, covers, tags, prerequisites and the artifact paths the tools
# still write).

# VST2 scan smoke: build the repo VST2 fixture and prove Keepsake exposes it through the CLAP factory (headless; owner platform; status ready; covers keepsake.vst2.scan, keepsake.clap.factory; tags smoke, vst2, headless, macos, linux).
# Proof: scan-path override, VST2 metadata extraction and CLAP descriptor exposure still work together.
# Prerequisites: macOS or Linux; CMake toolchain and network access for the first configure.
# Artifacts: .effigy/demo/artifacts/shared/vst2-host-stack-configure.log, .effigy/demo/artifacts/shared/vst2-host-stack-build.log, .effigy/demo/artifacts/vst2-scan-smoke/clap-scan.txt
[tasks."demo:vst2-scan-smoke"]
run = [
  { task = "demo:build:vst2-host-stack" },
  { run = "mkdir -p .effigy/demo/artifacts/vst2-scan-smoke" },
  { run = "env KEEPSAKE_VST2_PATH=\"$(./tools/demo-asset-path.sh vst2-fixture)\" ./tools/demo-capture.sh .effigy/demo/artifacts/vst2-scan-smoke/clap-scan.txt ./build/clap-scan $(./tools/demo-asset-path.sh clap-bundle)" },
]

# VST2 host audio smoke: load the repo VST2 fixture through Keepsake in the host harness and wait for audio (headless; owner platform; status ready; covers keepsake.bridge.audio, keepsake.vst2.instantiate; tags smoke, vst2, audio, headless, macos, linux).
# Proof: factory lookup, bridge launch, activation and audio processing still work end to end.
# Prerequisites: macOS or Linux; CMake toolchain and network access for the first configure.
# Artifacts: .effigy/demo/artifacts/shared/vst2-host-stack-configure.log, .effigy/demo/artifacts/shared/vst2-host-stack-build.log, .effigy/demo/artifacts/vst2-host-audio-smoke/host-test.txt
[tasks."demo:vst2-host-audio-smoke"]
run = [
  { task = "demo:build:vst2-host-stack" },
  { run = "mkdir -p .effigy/demo/artifacts/vst2-host-audio-smoke" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/vst2-host-audio-smoke/host-test.txt ./build/host-test $(./tools/demo-asset-path.sh clap-bundle) $(./tools/demo-asset-path.sh plugin-id) --max-memory-mb 1024 --vst-path $(./tools/demo-asset-path.sh vst2-fixture)" },
]

# VST2 host threaded smoke: run the threaded host harness against the repo VST2 fixture and fail if main-thread lifecycle calls block (headless; owner platform; status ready; covers keepsake.bridge.host-threading, keepsake.vst2.instantiate; tags smoke, vst2, threading, headless, macos, linux).
# Proof: Keepsake still avoids host-visible main-thread stalls while loading and starting the bridged fixture.
# Prerequisites: macOS or Linux; CMake toolchain and network access for the first configure.
# Artifacts: .effigy/demo/artifacts/shared/vst2-host-stack-configure.log, .effigy/demo/artifacts/shared/vst2-host-stack-build.log, .effigy/demo/artifacts/vst2-host-threaded-smoke/host-test-threaded.txt
[tasks."demo:vst2-host-threaded-smoke"]
run = [
  { task = "demo:build:vst2-host-stack" },
  { run = "mkdir -p .effigy/demo/artifacts/vst2-host-threaded-smoke" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/vst2-host-threaded-smoke/host-test-threaded.txt ./build/host-test-threaded $(./tools/demo-asset-path.sh clap-bundle) $(./tools/demo-asset-path.sh plugin-id) --timeout-ms 500 --entry-timeout-ms 5000 --max-memory-mb 1024 --vst-path $(./tools/demo-asset-path.sh vst2-fixture)" },
]

# VST2 GUI smoke: build a tiny VST2 editor fixture and open it through Keepsake in the mac host harness using the current live-editor posture (interactive; owner platform; status ready; covers keepsake.bridge.gui, keepsake.vst2.editor; tags smoke, vst2, gui, interactive, macos).
# Proof: the bridge can load, show, script and close a minimal VST2 editor on the supported macOS live-window path.
# Prerequisites: macOS; CMake toolchain and network access for the first configure.
# Artifacts: .effigy/demo/artifacts/shared/vst2-gui-stack-configure.log, .effigy/demo/artifacts/shared/vst2-gui-stack-build.log, .effigy/demo/artifacts/vst2-gui-smoke/mac-clap-host.txt
[tasks."demo:vst2-gui-smoke"]
run = [
  { task = "demo:build:vst2-gui-stack" },
  { run = "mkdir -p .effigy/demo/artifacts/vst2-gui-smoke" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/vst2-gui-smoke/mac-clap-host.txt ./build/mac-clap-host $(./tools/demo-asset-path.sh clap-bundle) $(./tools/demo-asset-path.sh gui-plugin-id) --vst-path $(./tools/demo-asset-path.sh gui-vst2-fixture) --open-ui --ui-mode live --host-mode stable --script-click-center --ui-seconds 2 --telemetry-seconds 1" },
]

# VST2 GUI param-state smoke: exercise CLAP params and state round-trip against the tiny GUI VST2 fixture after the editor path has been proven (headless; owner platform; status ready; covers keepsake.bridge.params, keepsake.bridge.state, keepsake.vst2.editor; tags smoke, vst2, params, state, macos).
# Proof: on the same fixture, host-side param flush changes state chunks and state load restores the prior chunk.
# Prerequisites: macOS; CMake toolchain and network access for the first configure.
# Artifacts: .effigy/demo/artifacts/shared/vst2-gui-stack-configure.log, .effigy/demo/artifacts/shared/vst2-gui-stack-build.log, .effigy/demo/artifacts/vst2-gui-param-state-smoke/mac-clap-host.txt
[tasks."demo:vst2-gui-param-state-smoke"]
run = [
  { task = "demo:build:vst2-gui-stack" },
  { run = "mkdir -p .effigy/demo/artifacts/vst2-gui-param-state-smoke" },
  { run = "./tools/demo-capture.sh .effigy/demo/artifacts/vst2-gui-param-state-smoke/mac-clap-host.txt ./build/mac-clap-host $(./tools/demo-asset-path.sh clap-bundle) $(./tools/demo-asset-path.sh gui-plugin-id) --vst-path $(./tools/demo-asset-path.sh gui-vst2-fixture) --exercise-param-state" },
]

# VST2 GUI preview UI-state smoke: use the diagnostic preview path to script a UI click, then prove the resulting state chunk changed and restores cleanly (headless; owner platform; status ready; covers keepsake.bridge.gui-preview, keepsake.bridge.state, keepsake.vst2.editor; tags smoke, vst2, gui, state, diagnostic, macos).
# Proof: editor-originated state changes can be exercised on the tiny fixture without pretending the supported live-window path is host-scriptable. Diagnostic-only.
# Prerequisites: macOS; CMake toolchain and network access for the first configure.
# Artifacts: .effigy/demo/artifacts/shared/vst2-gui-stack-configure.log, .effigy/demo/artifacts/shared/vst2-gui-stack-build.log, .effigy/demo/artifacts/vst2-gui-preview-ui-state-smoke/mac-clap-host.txt
[tasks."demo:vst2-gui-preview-ui-state-smoke"]
run = [
  { task = "demo:build:vst2-gui-stack" },
  { run = "mkdir -p .effigy/demo/artifacts/vst2-gui-preview-ui-state-smoke" },
  { run = "env KEEPSAKE_MAC_ENABLE_PREVIEW=1 ./tools/demo-capture.sh .effigy/demo/artifacts/vst2-gui-preview-ui-state-smoke/mac-clap-host.txt ./build/mac-clap-host $(./tools/demo-asset-path.sh clap-bundle) $(./tools/demo-asset-path.sh gui-plugin-id) --vst-path $(./tools/demo-asset-path.sh gui-vst2-fixture) --open-ui --ui-mode preview --host-mode stable --attach-target requested-parent --script-click-center --script-delay-ms 250 --ui-seconds 1 --exercise-ui-param-state" },
]
